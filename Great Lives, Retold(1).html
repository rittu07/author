<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Great Lives, Retold</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Playfair+Display:ital@0;1&amp;family=PT+Serif:ital@0;1&amp;family=Old+Standard+TT:ital@0;1&amp;family=Libre+Baskerville:ital@0;1&amp;family=EB+Garamond:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#14120f;--parch:#ece4d0;--ember:#d9a24a;--dim:#a39b88;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#14120f}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--parch);font-family:"PT Serif",Georgia,serif;min-height:100%}
body.lock{overflow:hidden}
#home{max-width:62rem;margin:0 auto;padding:2.5rem 1.25rem 3rem;text-align:center}
#home h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(2.3rem,7vw,4rem);margin:0 0 .6rem;line-height:1.1}
.lead{color:var(--dim);max-width:34rem;margin:0 auto 2.4rem;font-size:1.05rem;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:2rem 1rem}
.pick{background:none;border:0;border-radius:0;padding:.4rem;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.ph{width:7.5rem;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--c);transition:transform .25s,box-shadow .25s;margin-bottom:.3rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pick:hover .ph,.pick:focus-visible .ph{transform:scale(1.07);box-shadow:0 8px 26px #000b}
.pick:focus-visible{outline:2px solid var(--c);outline-offset:4px}
.pick b{font-weight:400;font-size:1.2rem;font-style:italic}
.pick small{color:var(--dim);font-size:.85rem}
.pick span{color:var(--parch);font-size:.92rem}
.note{margin-top:2.5rem;color:var(--dim);font-size:.85rem}
#stage{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:background 1.4s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink);color:var(--parch)}
#stage.on{display:flex}
.glow{position:absolute;left:50%;top:34%;width:min(60vw,420px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--ember) 0%,transparent 68%);opacity:.32;animation:flick 3s infinite alternate ease-in-out}
@keyframes flick{from{opacity:.2;transform:translate(-50%,-50%) scale(.94)}to{opacity:.38;transform:translate(-50%,-50%) scale(1.06)}}
.place{position:absolute;top:10%;left:0;right:0;text-align:center;padding:0 1.5rem;font-size:clamp(2rem,7vw,4.2rem);font-style:italic;line-height:1.1}
.sub{display:block;margin-top:.6rem;font-size:clamp(.95rem,2.4vw,1.2rem);font-style:normal;color:var(--dim)}
.portrait{flex:1;min-height:0;margin-top:calc(10vh + 6.5rem);display:flex;justify-content:center;align-items:center;position:relative}
.frame{height:100%;max-height:340px;border-radius:50%;overflow:hidden;border:4px solid var(--ember);box-shadow:0 6px 24px #000a;background:#2b2016}
.frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.05);transition:transform 6s ease-out;display:block}
.talk .frame img{transform:scale(1.16)}
.cap{position:relative;max-width:46rem;margin:0 auto;padding:0 1.5rem 1.2rem;font-size:clamp(1.15rem,3.2vw,1.65rem);line-height:1.55;min-height:9.5em;text-align:left}
.bar{height:3px;background:#ffffff18;margin:0 1.5rem}
.bar i{display:block;height:100%;width:0;background:var(--ember);transition:width .4s}
.ctl{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;padding:.8rem 1rem 1rem}
#stage button{font:inherit;font-size:1rem;color:var(--parch);background:transparent;border:1px solid var(--dim);border-radius:2rem;padding:.5rem 1.1rem;cursor:pointer}
#stage button:hover{border-color:var(--ember)}
#stage button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.glow{animation:none}.frame img,.pick .ph{transition:none}}
</style>
</head>
<body>
<main id="home">
  <h1>Great Lives, Retold</h1>
  <p class="lead">Choose a name and hear their life story, told in the first person, one scene at a time.</p>
  <div class="grid" id="grid"></div>
  <p class="note">Narrations are dramatizations written from biographical facts, not the people's actual words.</p>
</main>
<div id="stage">
  <div class="glow"></div>
  <div class="place" id="place"></div>
  <div class="portrait"><div class="frame" id="frame"><img id="pimg" alt=""></div></div>
  <div class="cap" id="cap" aria-live="polite"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="ctl">
    <button id="back">All names</button>
    <button id="prev" aria-label="Previous scene">Back</button>
    <button id="pp">Pause</button>
    <button id="next" aria-label="Next scene">Onward</button>
    <button id="mute">Voice: on</button>
  </div>
</div>

{p:"A Candlelit Desk",s:"London, anno 1610",bg:"#14100c",t:"Good morrow, gentle friend! Draw near, and lend thine ear a while. They call me William Shakespeare, a humble player and a poet by trade."},
{p:"Stratford-upon-Avon",s:"April, 1564",bg:"#1d2a1a",t:"In Stratford-upon-Avon was I born, in April of fifteen hundred sixty-four. My father, John, made fine gloves, and my mother, Mary, came of the Arden family. I learned my letters at the grammar school."},
{p:"A Cottage Hearth",s:"Wed at eighteen",bg:"#2a1c14",t:"At eighteen I did wed Anne Hathaway. Three children had we: Susanna, and the twins, Hamnet and Judith. Sweet Hamnet I lost too soon, and grief hath often found its way into my verse."},
{p:"The Globe Theatre",s:"Bankside, by the Thames",bg:"#2a1414",t:"To London I did journey, seeking fortune in the playhouse. I wrote and played with the Lord Chamberlain's Men, later the King's Men, and we built the Globe beside the Thames. There kings and clowns, lovers and ghosts took the stage."},
{p:"Quill and Parchment",s:"Thirty-odd plays, a hundred fifty-four sonnets",bg:"#1a1620",t:"Some thirty-odd plays I wrote, and sonnets by the score, all to catch the rhythm of the human heart, its folly and its glory."},
{p:"Home Again",s:"Stratford, 1616",bg:"#2a2014",t:"At last I laid aside the pen and went home to Stratford, where I died in the spring of sixteen sixteen. Yet words, they say, outlive the man. All the world's a stage, dear friend. Farewell!"}]},

{p:"A Candlelit Study",s:"Gad's Hill, Kent",bg:"#14171a",t:"Good evening, dear reader, and welcome to my fireside. I am Charles Dickens, a writer of stories, a wanderer of London's crowded streets, and a firm believer in a good Christmas."},
{p:"Portsmouth and the Marshalsea",s:"1812 to 1824",bg:"#20242a",t:"I was born in Portsmouth in February of eighteen twelve. When my father was jailed for debt in the Marshalsea prison, I was twelve years old and sent to work in a blacking warehouse, pasting labels on bottles. I never forgot it, and it taught me what hardship does to a child."},
{p:"The Streets of London",s:"Boz, 1836",bg:"#2a2420",t:"I became a law clerk, then a newspaper reporter, and began publishing little sketches of city life under the name Boz. Then came The Pickwick Papers, issued in monthly parts, and readers waited eagerly for each instalment."},
{p:"Orphans, Misers and Clerks",s:"Oliver Twist to David Copperfield",bg:"#1a2028",t:"Oliver Twist followed, and in eighteen forty-three A Christmas Carol, then David Copperfield. I wrote of the poor, the orphaned and the overlooked, and I hoped that those who read of them might not look away."},
{p:"Great Expectations",s:"A Tale of Two Cities, and ten children",bg:"#261c1c",t:"Bleak House, Hard Times, A Tale of Two Cities, and Great Expectations all came from my pen, while ten children came to my home. I also read my stories aloud in crowded theatres, and I loved to hear an audience laugh and weep."},
{p:"Gad's Hill Place",s:"June, 1870",bg:"#181818",t:"I died at Gad's Hill Place, my home in Kent, in June of eighteen seventy, and was laid to rest in Poets' Corner at Westminster Abbey. My stories, I hope, still keep company with all who have known hard times or a warm fire. God bless us, every one!"}]},

{p:"A Writing Desk",s:"Yasnaya Polyana, evening",bg:"#151a16",t:"Good day, my friend. I am Leo Nikolayevich Tolstoy, a count by birth, a soldier in my youth, a writer by calling, and, in my later years, a seeker after how a person ought to live."},
{p:"Yasnaya Polyana",s:"Born September, 1828",bg:"#1d2a1c",t:"I was born in September of eighteen twenty-eight on my family's estate, Yasnaya Polyana, south of Moscow. I lost both my parents while still a child and was raised by relatives. I left Kazan University without a degree, which disappointed nearly everyone."},
{p:"The Caucasus and Sevastopol",s:"Soldier and young writer",bg:"#2a2a22",t:"I joined the army and served in the Caucasus, and during the Crimean War I was at the siege of Sevastopol, where I saw what war truly is. It was in those years that I began to publish my first stories, Childhood among them."},
{p:"A Family Estate",s:"Sophia, and the great novels",bg:"#241c18",t:"In eighteen sixty-two I married Sophia Behrs, and we raised thirteen children. At Yasnaya Polyana I wrote War and Peace, and then Anna Karenina, trying to understand how ordinary people live, love, and suffer."},
{p:"A Change of Heart",s:"Faith, simplicity, and nonviolence",bg:"#1c2228",t:"In middle age I grew troubled by wealth, war, and my own idle comfort. I turned toward simple living and nonviolence, and the Church excommunicated me in nineteen oh one. Letters of mine reached a young lawyer in South Africa named Gandhi, and my ideas travelled farther than I ever imagined."},
{p:"Astapovo",s:"November, 1910",bg:"#121416",t:"In the autumn of nineteen ten, at eighty-two, I left home to find a quieter way to live. I fell ill on the journey, and died at the small railway station of Astapovo, in November. Look to how you live, dear friend, for that is the story that matters most."}]},

{p:"A Study at Christ Church",s:"Oxford, a quiet afternoon",bg:"#1b1812",t:"Good day, dear reader, and welcome, though I must warn you that sense is entirely optional here. My name is Charles Lutwidge Dodgson, but you may know me as Lewis Carroll, which is a sort of hat I wear when I write nonsense."},
{p:"Daresbury, Cheshire",s:"January, 1832",bg:"#1f2a26",t:"I was born at Daresbury in Cheshire, in January of eighteen thirty-two, the eldest boy of eleven children. My father was a clergyman. To amuse my brothers and sisters, I made up games, puzzles, and little magazines of my own."},
{p:"Christ Church, Oxford",s:"Mathematics, logic, and a great deal of tea",bg:"#2a2418",t:"To Oxford I went, and from Oxford I scarcely left. I became a lecturer in mathematics at Christ Church, and wrote books on geometry and logic that were, I confess, a good deal less popular than what followed."},
{p:"A Golden Afternoon",s:"On the river Thames, July 1862",bg:"#1a2430",t:"On a summer afternoon I rowed up the river with three young sisters, the Liddells. To amuse Alice, I told a tale of a girl who tumbled down a rabbit hole. She begged me to write it down, and in eighteen sixty-five it became a book."},
{p:"Through the Looking-Glass",s:"Riddles, puns, and photographs",bg:"#241c2c",t:"Through the Looking-Glass followed in eighteen seventy-one, and then The Hunting of the Snark. I was also an eager photographer, in the days when the art was new, and I was always fond of a good riddle and a better pun."},
{p:"Guildford",s:"January, 1898",bg:"#1c1c1c",t:"I died at Guildford in January of eighteen ninety-eight, though Alice, I am told, has never grown a day older. Do take care near rabbit holes, dear reader, and remember: it's a poor sort of memory that only works backwards."}]},

{p:"A Study in Hartford",s:"Connecticut, evening",bg:"#121212",t:"Good evening, friends. My name is Samuel Clemens, though most of you know me as Mark Twain. I have been a printer, a riverboat pilot, a prospector, a lecturer, and a writer, and I am told I am fond of telling stories, some of them even true."},
{p:"Hannibal, Missouri",s:"Born November, 1835",bg:"#1f2619",t:"I was born in the village of Florida, Missouri, in November of eighteen thirty-five, the year Halley's Comet crossed the sky. I grew up in Hannibal, on the banks of the Mississippi. When my father died, I was eleven, and I went to work as a printer's apprentice. That river town later gave the world Tom Sawyer and Huck Finn."},
{p:"The Mighty Mississippi",s:"Steamboat pilot",bg:"#17252b",t:"I trained as a steamboat pilot, the finest job a boy ever had, until the Civil War closed the river to traffic. The leadsman's call for safe water, mark twain, meaning two fathoms deep, gave me the name I would write under."},
{p:"The Wild West",s:"Nevada and California, 1860s",bg:"#2b2012",t:"I went west to Nevada and California, tried my hand at mining, and failed handsomely. But I found newspaper writing, and in eighteen sixty-five a tale about a jumping frog made my name. The Innocents Abroad soon followed, and the public bought it by the thousands."},
{p:"Hartford, Connecticut",s:"Books, bankruptcy and a world tour",bg:"#1c1a24",t:"I married Olivia Langdon in eighteen seventy and settled in Hartford. There I wrote Tom Sawyer, The Prince and the Pauper, and Adventures of Huckleberry Finn. Bad investments left me bankrupt in eighteen ninety-four, so I toured the world lecturing until every debt was paid."},
{p:"Redding, Connecticut",s:"April, 1910",bg:"#1a1414",t:"I came in with Halley's Comet and I expected to go out with it, and so I did, in April of nineteen ten, at my home in Redding. So there you have it, dear friends: a life told with a straight face, mostly."}]},

{p:"A Study in Sussex",s:"Crowborough, an autumn evening",bg:"#17140f",t:"Good day, dear reader. I am Arthur Conan Doyle, a physician by training and a storyteller by habit. I am best known for a detective who, I confess, has long outshone his author."},
{p:"Edinburgh",s:"Born May, 1859",bg:"#1c2230",t:"I was born in Edinburgh in May of eighteen fifty-nine. I was schooled by the Jesuits at Stonyhurst, then studied medicine at Edinburgh University. There I met Doctor Joseph Bell, who could read a stranger's trade and travels from the smallest details, and whom I never forgot."},
{p:"Ships and Southsea",s:"Whalers, West Africa, and waiting patients",bg:"#14262e",t:"As a young ship's surgeon, I sailed to the Arctic whaling grounds and to the coast of West Africa. Then I set up a medical practice in Southsea. Patients were few at first, so while I waited for them, I wrote."},
{p:"221B Baker Street",s:"A Study in Scarlet, 1887",bg:"#2a2418",t:"In eighteen eighty-seven, A Study in Scarlet introduced Mister Sherlock Holmes and his friend Doctor Watson to the world. When the Strand Magazine began printing their short adventures in eighteen ninety-one, readers queued at the newsstands to buy each new tale."},
{p:"Reichenbach Falls",s:"1893, and a most unpopular decision",bg:"#121a22",t:"Weary of Holmes, I sent him over the Reichenbach Falls in eighteen ninety-three, and the public was furious. I turned to historical adventures and to The Lost World, with Professor Challenger. But readers would not be denied, and with The Hound of the Baskervilles and later tales, I brought my detective back."},
{p:"Knight and Crusader",s:"Boer War, and the pursuit of justice",bg:"#1f2a1e",t:"I served as a volunteer doctor in the South African war, and was knighted in nineteen oh two. I also took up the cases of two wrongly convicted men, George Edalji and Oscar Slater, for I believed a detective's cleverness should serve justice. Later in life, after the Great War, I became a devoted student of spiritualism."},
{p:"Crowborough, Sussex",s:"July, 1930",bg:"#1a1814",t:"I died at my home in Crowborough, in Sussex, in July of nineteen thirty. Keep your eyes open, dear reader, and observe as well as see, for the game, as my friend Holmes would say, is afoot."}]},

{p:"A Farmhouse Porch",s:"Vermont, late afternoon",bg:"#1c1a12",t:"Good afternoon, friend. I am Robert Frost, a farmer when I could manage it, a teacher when I had to be, and a poet all the way through. Pull up a chair, and I will tell you how it went."},
{p:"San Francisco to New England",s:"Born March, 1874",bg:"#2a2218",t:"I was born in San Francisco in March of eighteen seventy-four. When my father died, my mother took us east to New England, and its hills, stone walls, and woods became the landscape of my life."},
{p:"A Farm in Derry",s:"New Hampshire, 1900 to 1909",bg:"#22301f",t:"I tried college and left without a degree. Then I farmed in Derry, New Hampshire, rising before dawn to write while the household slept. Country work taught me the talk of country people, and I wanted my poems to sound like it."},
{p:"England",s:"1912 to 1915",bg:"#1a2630",t:"In nineteen twelve I took my family to England, where my first books, A Boy's Will and North of Boston, were published. I made friends with other poets there, among them Ezra Pound, and most of all Edward Thomas."},
{p:"The Road Not Taken",s:"Written in England, published 1916",bg:"#2a2412",t:"Edward Thomas and I took long walks in the English countryside, and he would always regret whichever path we chose, wondering what we had missed on the other. I wrote The Road Not Taken partly to tease him. It appeared in nineteen sixteen, in my collection Mountain Interval."},
{p:"A Poem Often Misread",s:"The road, and the story we tell",bg:"#1e1a14",t:"Many readers take that poem as a hymn to boldly choosing the lonely path. Look closely, though. The two roads were nearly alike, and the traveller admits he will someday retell his choice with a sigh. It is a poem about how we shape the story of our own choices afterward."},
{p:"Honours and Farewell",s:"1961 and 1963",bg:"#101418",t:"I won four Pulitzer Prizes. In January nineteen sixty-one, at President Kennedy's inauguration, the winter sun was too bright for my page, so I spoke a poem from memory. I died in Boston in January of nineteen sixty-three. A poem, I always said, begins in delight and ends in wisdom."}]},

{p:"A Teacher's Classroom",s:"Namaste, my young friends",bg:"#0d1522",t:"Namaste, my young friends. I am Avul Pakir Jainulabdeen Abdul Kalam. I have been a student, a scientist, and a President, but above all, I have been a teacher, and I am happiest among the young."},
{p:"Rameswaram, Tamil Nadu",s:"15 October, 1931",bg:"#10252b",t:"I was born in Rameswaram on the fifteenth of October, nineteen thirty-one. My father owned boats and led prayers, and my mother's kindness filled our home. As a boy I delivered newspapers to help my family, and I would watch the birds in flight and wonder how they flew."},
{p:"From Tiruchirappalli to Madras",s:"Physics, then aeronautical engineering",bg:"#1a2433",t:"I studied physics at St. Joseph's College in Tiruchirappalli, and then aeronautical engineering at the Madras Institute of Technology. I dreamed of flying fighter jets, and I missed the air force by a single place. That closed door taught me to look for another."},
{p:"Sriharikota",s:"ISRO, July 1980",bg:"#1d1830",t:"I joined the defence research organisation in nineteen fifty-eight, and in nineteen sixty-nine moved to ISRO. There I led the project to build India's first satellite launch vehicle, the SLV-three, which carried the Rohini satellite into orbit in July of nineteen eighty."},
{p:"Missiles and Mission",s:"DRDO, and the Bharat Ratna",bg:"#1f2a22",t:"Returning to the defence research organisation, I led India's guided missile programme, and the newspapers began calling me the Missile Man. In nineteen ninety-seven, the nation honoured me with the Bharat Ratna, its highest civilian award."},
{p:"Rashtrapati Bhavan",s:"New Delhi, 2002 to 2007",bg:"#2a1c14",t:"In two thousand two I became the eleventh President of India, and the people called me their People's President. What I loved best was meeting students. I wrote books, Wings of Fire among them, to tell young Indians that a humble beginning is no barrier to a great dream."},
{p:"A Lecture Hall, Shillong",s:"27 July, 2015",bg:"#101828",t:"On the twenty-seventh of July, twenty fifteen, I was giving a lecture to students at IIM Shillong when I passed away. I could ask for no better ending than that. Look up at the sky, my friends, dream big, and never stop learning."}]}];

  st.classList.add("talk");
  typer=setInterval(()=>{if(paused)return;k++;cap.textContent=sc.t.slice(0,k);if(k>=sc.t.length){clearInterval(typer);st.classList.remove("talk")}},ms*0.62);
  let done=false;const adv=()=>{if(done||my!==tok)return;done=true;timer=setTimeout(()=>{if(my!==tok)return;n<S.length-1?show(n+1):end()},1200)};
  const dur=sc.t.length*ms*0.62+800;
  if(voice&&synth){try{const u=new SpeechSynthesisUtterance(sc.t);const v=pick();if(v)u.voice=v;u.rate=A.rate;u.pitch=A.pitch;u.onend=adv;u.onerror=()=>setTimeout(adv,dur);synth.speak(u);return}catch(e){}}
  timer=setTimeout(adv,dur+1500);
}
function end(){$("pp").textContent="Replay";paused=false}
function openA(k){
  A=AUTH[k];S=A.scenes;paused=false;$("pp").textContent="Pause";
  const m={"--ink":A.ink,"--parch":A.parch,"--ember":A.ember,"--claret":A.claret,"--dim":A.dim};
  for(const p in m)st.style.setProperty(p,m[p]);
  st.style.fontFamily='"'+A.font+'",Georgia,serif';
  $("frame").style.aspectRatio=A.asp;$("pimg").src=A.img;$("pimg").alt=A.alt;$("pimg").style.objectPosition=A.pos;
  document.body.classList.add("lock");st.classList.add("on");show(0);$("pp").focus();
}
function toHome(){stop();st.classList.remove("on");document.body.classList.remove("lock")}
$("back").onclick=toHome;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&st.classList.contains("on"))toHome()});
$("pp").onclick=()=>{
  if($("pp").textContent==="Replay"){$("pp").textContent="Pause";return show(0)}
  paused=!paused;$("pp").textContent=paused?"Resume":"Pause";
  try{paused?synth.pause():synth.resume()}catch(e){}
};
$("prev").onclick=()=>{paused=false;$("pp").textContent="Pause";show(Math.max(0,i-1))};
$("next").onclick=()=>{paused=false;$("pp").textContent="Pause";show(Math.min(S.length-1,i+1))};
$("mute").onclick=()=>{voice=!voice;$("mute").textContent="Voice: "+(voice?"on":"off");show(i)};
</script>
